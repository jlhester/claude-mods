<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232838"/>
      <stop offset="1" stop-color="#161a24"/>
    </linearGradient>
  </defs>

  <!-- Terminal window -->
  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#bg)"/>

  <!-- Chat side: a bold prompt and cursor -->
  <path d="M124 428 L226 512 L124 596" fill="none" stroke="#8b93a7" stroke-width="64"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="262" y="566" width="104" height="58" rx="29" fill="#8b93a7"/>

  <!-- The pane on the right -->
  <rect x="410" y="150" width="470" height="724" rx="72" fill="#323a50"/>

  <!-- A done command: a large check over two thick lines of output -->
  <path d="M494 330 L572 408 L728 252" fill="none" stroke="#5fd38d" stroke-width="72"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="486" y="500" width="320" height="64" rx="32" fill="#c9cfdc"/>
  <rect x="486" y="610" width="240" height="64" rx="32" fill="#c9cfdc"/>
  <!-- Live output still arriving -->
  <rect x="486" y="720" width="164" height="64" rx="32" fill="#7aa2f7"/>
</svg>
